name: Manual backfill

on:
  workflow_dispatch:
    inputs:
      client:
        description: Which client to run the backfill for
        required: true
        type: choice
        options:
          - isogreen
          - miradex
      script:
        description: Which backfill to run
        required: true
        type: choice
        options:
          - thumbnails
          - monthly-views
          - tiktok-monthly
          - create-daily-views-db
          - daily-views
          - create-follower-snapshots-db
          - fix-facebook-daily
          - follower-history
          - clean-instagram-zero-views
          - clean-facebook-zero-views
          - create-video-analysis-db

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Run backfill
        env:
          CLIENT_SLUG: ${{ github.event.inputs.client }}
          CLIENT_NAME: ${{ github.event.inputs.client == 'isogreen' && 'ISOGREEN' || 'MIRADEX' }}
          NOTION_FILTER_TIP: ${{ github.event.inputs.client == 'isogreen' && 'true' || 'false' }}
          YT_FIELD_NAME: ${{ github.event.inputs.client == 'miradex' && 'V7Z - Yt Shorts' || 'YouTube' }}
          FB_FIELD_NAME: ${{ github.event.inputs.client == 'miradex' && 'V7Z - Fb' || 'Facebook' }}
          IG_FIELD_NAME: ${{ github.event.inputs.client == 'miradex' && 'V7Z - Insta' || 'Instagram' }}
          TT_FIELD_NAME: ${{ github.event.inputs.client == 'miradex' && 'V7Z - TikTok' || 'TikTok' }}
          # Shared across clients - same Google Cloud project / Notion integration / Zernio account.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          ZERNIO_API_KEY: ${{ secrets.ZERNIO_API_KEY }}
          # Per-client - looked up as <CLIENT>_<NAME> from repo secrets.
          NOTION_DATABASE_ID: ${{ secrets[format('{0}_NOTION_DATABASE_ID', github.event.inputs.client)] }}
          LONG_FORM_NOTION_DATABASE_ID: ${{ secrets[format('{0}_LONG_FORM_NOTION_DATABASE_ID', github.event.inputs.client)] }}
          CHANNEL_HANDLE: ${{ secrets[format('{0}_CHANNEL_HANDLE', github.event.inputs.client)] }}
          FB_PAGE_ID: ${{ secrets[format('{0}_FB_PAGE_ID', github.event.inputs.client)] }}
          FB_PAGE_ACCESS_TOKEN: ${{ secrets[format('{0}_FB_PAGE_ACCESS_TOKEN', github.event.inputs.client)] }}
          ZERNIO_TIKTOK_ACCOUNT_ID: ${{ secrets[format('{0}_ZERNIO_TIKTOK_ACCOUNT_ID', github.event.inputs.client)] }}
          CHANNEL_STATS_DATABASE_ID: ${{ secrets[format('{0}_CHANNEL_STATS_DATABASE_ID', github.event.inputs.client)] }}
          MONTHLY_VIEWS_DATABASE_ID: ${{ secrets[format('{0}_MONTHLY_VIEWS_DATABASE_ID', github.event.inputs.client)] }}
          DAILY_VIEWS_DATABASE_ID: ${{ secrets[format('{0}_DAILY_VIEWS_DATABASE_ID', github.event.inputs.client)] }}
          FOLLOWER_SNAPSHOTS_DATABASE_ID: ${{ secrets[format('{0}_FOLLOWER_SNAPSHOTS_DATABASE_ID', github.event.inputs.client)] }}
          YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets[format('{0}_YOUTUBE_OAUTH_CLIENT_ID', github.event.inputs.client)] }}
          YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets[format('{0}_YOUTUBE_OAUTH_CLIENT_SECRET', github.event.inputs.client)] }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets[format('{0}_YOUTUBE_REFRESH_TOKEN', github.event.inputs.client)] }}
        run: npm run backfill:${{ github.event.inputs.script }}

      # Overlays this run's dist/clients/ onto the existing public repo
      # rather than replacing it wholesale - this backfill only produces
      # thumbs/, not index.html, so a wholesale overwrite would delete the
      # live dashboard from the public repo.
      - name: Publish built dashboard to public output repo
        if: ${{ github.event.inputs.script == 'thumbnails' }}
        run: |
          git clone -q "https://x-access-token:${DASHBOARD_REPO_PAT}@github.com/4642337DSC/upfilm-content-analytics-dashboard.git" /tmp/dashboard-repo
          cp -r dist/clients/. /tmp/dashboard-repo/
          cd /tmp/dashboard-repo
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A
          git diff --cached --quiet || git commit -q -m "Deploy dashboard $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -q origin main
        env:
          DASHBOARD_REPO_PAT: ${{ secrets.DASHBOARD_REPO_PAT }}
